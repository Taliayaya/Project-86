# Posts the UGS leaderboards to Discord on a schedule.
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   UGS_PROJECT, UGS_ENV, UGS_KEY_ID, UGS_SECRET, DISCORD_WEBHOOK
# The service account needs a Leaderboards viewer role on the project.
name: Post leaderboards to Discord
on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:       # manual run button
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Last run's standings, so the post can show movement. Cache keys are immutable, so save under
      # the run id and restore the newest match. Losing this cache (7 days idle, or a miss) costs one
      # report its arrows and nothing else: the poster falls back to a plain table.
      - uses: actions/cache@v4
        with:
          path: tools/leaderboard/state
          key: leaderboard-state-${{ github.run_id }}
          restore-keys: leaderboard-state-
      - run: python3 tools/leaderboard/lb.py
        env:
          UGS_PROJECT: ${{ secrets.UGS_PROJECT }}
          UGS_ENV: ${{ secrets.UGS_ENV }}
          UGS_KEY_ID: ${{ secrets.UGS_KEY_ID }}
          UGS_SECRET: ${{ secrets.UGS_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
